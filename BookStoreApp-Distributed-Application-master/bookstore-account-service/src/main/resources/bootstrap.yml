spring:
  application:
    name: bookstore-account-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    consul:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: "*"

---
spring:
  profiles: local, mysql
  cloud:
    bus:
      enabled: false
    consul:
      enabled: false
      discovery:
        enabled: false

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost:8761}/eureka/
    registerWithEureka: true
    fetchRegistry: true
    enabled: true
  instance:
    prefer-ip-address: false

management:
  metrics:
    export:
      influx:
        enabled: false

---
spring:
  profiles: docker

  cloud:
    consul:
      enabled: true
      host: bookstore-consul-discovery
      port: 8500
      discovery:
        enabled: true
        instanceId: ${spring.application.name}:${random.value}

eureka:
  client:
    enabled: false

management:
  metrics:
    export:
      statsd:
        enabled: true
        flavor: telegraf
        port: 8125

      influx:
        enabled: true
        db: bookstore_influxdb_monitoring_metrics
        uri: http://bookstore-influxdb:8086
        auto-create-db: true
  endpoints:
    web:
      exposure:
        include: "*"

---
spring:
  config:
    activate:
      on-profile: local
google:
  client-id: 588602021149-k3e2vm6c05civnvleod2dumog2tj4f1a.apps.googleusercontent.com